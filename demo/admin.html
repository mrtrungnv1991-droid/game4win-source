<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GameTopup Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a14;--surface:#111122;--card:#161630;--border:rgba(255,255,255,0.06);--text:#e0e0f0;--muted:#7c7c9a;--cyan:#00d4ff;--purple:#7c3aed;--green:#10b981;--gold:#f59e0b;--red:#ef4444;--radius:12px;--radius-sm:8px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Inter",system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex}
.sidebar{width:240px;background:var(--surface);border-right:1px solid var(--border);padding:20px 0;position:fixed;top:0;left:0;bottom:0;overflow-y:auto;z-index:10}
.sidebar-logo{padding:0 20px 20px;font-size:1.2rem;font-weight:800;border-bottom:1px solid var(--border);margin-bottom:16px}
.sidebar-logo span{background:linear-gradient(135deg,var(--cyan),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sidebar-nav a{display:flex;align-items:center;gap:10px;padding:10px 20px;color:var(--muted);text-decoration:none;font-size:.85rem;font-weight:500;transition:all .2s}
.sidebar-nav a:hover,.sidebar-nav a.active{color:var(--text);background:rgba(255,255,255,0.03)}
.sidebar-nav a .badge{background:var(--cyan);color:#000;font-size:.68rem;padding:2px 8px;border-radius:20px;font-weight:700;margin-left:auto}
.main{margin-left:240px;flex:1;padding:24px 32px}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}
.header h1{font-size:1.5rem;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:28px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px}
.stat .val{font-size:1.6rem;font-weight:800}
.stat .lbl{font-size:.75rem;color:var(--muted);margin-top:4px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:20px}
.card h2{font-size:1rem;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px}
table{width:100%;border-collapse:collapse;font-size:.82rem}
th{text-align:left;padding:10px 12px;color:var(--muted);font-weight:600;font-size:.73rem;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border)}
td{padding:10px 12px;border-bottom:1px solid rgba(255,255,255,0.03)}
tr:hover td{background:rgba(255,255,255,0.02)}
.badge-sm{padding:3px 10px;border-radius:20px;font-size:.7rem;font-weight:600;display:inline-block}
.badge-success{background:rgba(16,185,129,0.15);color:var(--green)}
.badge-pending{background:rgba(245,158,11,0.15);color:var(--gold)}
.badge-failed{background:rgba(239,68,68,0.15);color:var(--red)}
.btn{padding:8px 16px;border-radius:6px;border:none;font-size:.8rem;font-weight:600;cursor:pointer;transition:all .2s}
.btn-primary{background:linear-gradient(135deg,var(--cyan),var(--purple));color:#fff}
.btn-primary:hover{opacity:0.85}
.btn-sm{padding:5px 12px;font-size:.72rem;border-radius:4px}
.btn-danger{background:rgba(239,68,68,0.15);color:var(--red);border:1px solid rgba(239,68,68,0.2)}
.btn-danger:hover{background:rgba(239,68,68,0.25)}
.btn-green{background:rgba(16,185,129,0.15);color:var(--green);border:1px solid rgba(16,185,129,0.2)}
.btn-green:hover{background:rgba(16,185,129,0.25)}
input,select{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:6px;font-size:.82rem;font-family:inherit;outline:none}
input:focus,select:focus{border-color:var(--cyan)}
.tabs{display:flex;gap:0;margin-bottom:16px;border-bottom:2px solid var(--border)}
.tab{padding:10px 20px;font-size:.82rem;font-weight:600;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .2s}
.tab:hover{color:var(--text)}
.tab.active{color:var(--cyan);border-bottom-color:var(--cyan)}
.empty{text-align:center;padding:40px;color:var(--muted)}
.empty .icon{font-size:3rem;margin-bottom:12px}
.section{display:none}.section.active{display:block}
.flex-between{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.search-inline{display:flex;gap:8px;align-items:center}
@media(max-width:768px){.sidebar{width:60px}.sidebar-logo span,.sidebar-nav a span:not(.badge){display:none}.main{margin-left:60px;padding:16px}}
</style>
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-logo"><span>⚡ GameTopup</span> Admin</div>
  <nav class="sidebar-nav">
    <a href="#" class="active" onclick="showSection('dashboard',this)">📊 Dashboard</a>
    <a href="#" onclick="showSection('orders',this)">📦 Đơn hàng <span class="badge" id="order-count-badge">0</span></a>
    <a href="#" onclick="showSection('games',this)">🎮 Games <span class="badge" id="game-count-badge">121</span></a>
    <a href="#" style="margin-top:20px;color:var(--muted);font-size:.75rem" onclick="window.open('index.html','_blank')">↗ Mở Frontend</a>
  </nav>
</aside>

<main class="main" id="main-content">

<!-- DASHBOARD -->
<section id="sec-dashboard" class="section active">
  <div class="header"><h1>📊 Dashboard</h1></div>
  <div class="stats" id="dash-stats"></div>
  <div class="card">
    <h2>📈 Đơn hàng gần đây</h2>
    <div id="recent-orders"><div class="empty"><div class="icon">📭</div>Chưa có đơn hàng nào</div></div>
  </div>
</section>

<!-- ORDERS -->
<section id="sec-orders" class="section">
  <div class="header">
    <h1>📦 Quản lý đơn hàng</h1>
    <div class="search-inline">
      <input type="text" id="order-search" placeholder="Tìm mã ĐH hoặc UID..." oninput="renderOrders()">
      <select id="order-filter" onchange="renderOrders()">
        <option value="all">Tất cả</option>
        <option value="success">✅ Thành công</option>
        <option value="pending">⏳ Đang xử lý</option>
        <option value="failed">❌ Thất bại</option>
        <option value="refunded">↩ Đã hoàn</option>
      </select>
    </div>
  </div>
  <div id="orders-table"></div>
</section>

<!-- GAMES -->
<section id="sec-games" class="section">
  <div class="header">
    <h1>🎮 Quản lý Games (121)</h1>
    <div class="search-inline">
      <input type="text" id="game-search" placeholder="Tìm game..." oninput="renderGames()">
      <select id="game-cat-filter" onchange="renderGames()">
        <option value="">Tất cả thể loại</option>
      </select>
    </div>
  </div>
  <div id="games-table"></div>
</section>

</main>

<script src="games_data.js"></script>
<script>
var GAMES=GAMES_DATA;
var STORAGE_KEY="gametopup_full";
var state=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{"balance":500000,"orders":[],"totalSpent":0,"orderCount":0}');
var orders=state.orders||[];
var currentSection="dashboard";

function showSection(name,el){
  document.querySelectorAll(".section").forEach(function(s){s.classList.remove("active")});
  document.getElementById("sec-"+name).classList.add("active");
  document.querySelectorAll(".sidebar-nav a").forEach(function(a){a.classList.remove("active")});
  if(el)el.classList.add("active");
  currentSection=name;
  if(name==="dashboard")renderDashboard();
  if(name==="orders")renderOrders();
  if(name==="games")renderGames();
}

// ===== DASHBOARD =====
function renderDashboard(){
  var successOrders=orders.filter(function(o){return o.status==="success"});
  var totalRevenue=successOrders.reduce(function(s,o){return s+o.price},0);
  var uniqueGames={};orders.forEach(function(o){uniqueGames[o.game]=true});
  
  document.getElementById("dash-stats").innerHTML=
    '<div class="stat"><div class="val" style="color:var(--cyan)">'+orders.length+'</div><div class="lbl">Tổng đơn</div></div>'+
    '<div class="stat"><div class="val" style="color:var(--green)">'+successOrders.length+'</div><div class="lbl">Thành công</div></div>'+
    '<div class="stat"><div class="val" style="color:var(--gold)">'+totalRevenue.toLocaleString()+'đ</div><div class="lbl">Doanh thu</div></div>'+
    '<div class="stat"><div class="val">'+Object.keys(uniqueGames).length+'</div><div class="lbl">Games đã bán</div></div>';
  
  if(!orders.length){
    document.getElementById("recent-orders").innerHTML='<div class="empty"><div class="icon">📭</div>Chưa có đơn hàng nào</div>';
    return;
  }
  var recent=orders.slice(0,10);
  document.getElementById("recent-orders").innerHTML='<table><thead><tr><th>Mã ĐH</th><th>Game</th><th>Gói</th><th>UID</th><th>Giá</th><th>TT</th><th>Thời gian</th></tr></thead><tbody>'+
    recent.map(function(o,idx){
      return '<tr><td style="font-family:monospace;font-size:.75rem">'+o.id+'</td><td>'+o.game+'</td><td>'+o.tier+'</td><td>'+o.uid+'</td><td style="font-weight:600">'+o.price.toLocaleString()+'đ</td><td><span class="badge-sm badge-'+o.status+'">'+o.status+'</span></td><td style="color:var(--muted);font-size:.73rem">'+o.time+'</td><td><button class="btn btn-sm btn-danger" onclick="refundOrder('+idx+')">↩ Hoàn</button></td></tr>';
    }).join("")+'</tbody></table>';
  document.getElementById("order-count-badge").textContent=orders.length;
}

// ===== ORDERS =====
function renderOrders(){
  var filter=document.getElementById("order-filter").value;
  var search=document.getElementById("order-search").value.trim().toLowerCase();
  var filtered=orders;
  if(filter!=="all")filtered=filtered.filter(function(o){return o.status===filter});
  if(search)filtered=filtered.filter(function(o){return o.id.toLowerCase().indexOf(search)>=0||o.uid.toLowerCase().indexOf(search)>=0||o.game.toLowerCase().indexOf(search)>=0});
  
  if(!filtered.length){
    document.getElementById("orders-table").innerHTML='<div class="card"><div class="empty"><div class="icon">📭</div>Không tìm thấy đơn hàng</div></div>';
    return;
  }
  document.getElementById("orders-table").innerHTML='<div class="card"><table><thead><tr><th>#</th><th>Mã ĐH</th><th>Game</th><th>Gói</th><th>UID</th><th>Giá</th><th>Trạng thái</th><th>Thời gian</th><th>Hành động</th></tr></thead><tbody>'+
    filtered.map(function(o,idx){
      var realIdx=orders.indexOf(o);
      return '<tr><td style="color:var(--muted)">'+(idx+1)+'</td><td style="font-family:monospace;font-size:.73rem">'+o.id+'</td><td>'+o.game+'</td><td>'+o.tier+'</td><td>'+o.uid+'</td><td style="font-weight:600">'+o.price.toLocaleString()+'đ</td><td><span class="badge-sm badge-'+o.status+'">'+o.status+'</span></td><td style="color:var(--muted);font-size:.73rem">'+o.time+'</td><td>'+
        (o.status==="success"?'<button class="btn btn-sm btn-danger" onclick="refundOrder('+realIdx+')">↩ Hoàn tiền</button>':'')+
        (o.status==="pending"?'<button class="btn btn-sm btn-green" onclick="markSuccess('+realIdx+')">✅ Done</button>':'')+
      '</td></tr>';
    }).join("")+'</tbody></table></div>';
}

function refundOrder(idx){
  if(!confirm("Hoàn "+orders[idx].price.toLocaleString()+"đ cho đơn #"+orders[idx].id+"?"))return;
  state.balance+=orders[idx].price;
  state.totalSpent-=orders[idx].price;
  state.orderCount--;
  orders[idx].status="refunded";
  state.orders=orders;
  saveAndRender();
}

function markSuccess(idx){
  orders[idx].status="success";
  state.orders=orders;
  saveAndRender();
}

// ===== GAMES =====
function renderGames(){
  var search=document.getElementById("game-search").value.trim().toLowerCase();
  var cat=document.getElementById("game-cat-filter").value;
  var filtered=GAMES;
  if(cat)filtered=filtered.filter(function(g){return g.cat===cat});
  if(search)filtered=filtered.filter(function(g){return g.name.toLowerCase().indexOf(search)>=0});
  
  document.getElementById("games-table").innerHTML='<div class="card"><div class="flex-between" style="margin-bottom:16px"><span>Hiển thị <b>'+filtered.length+'</b>/'+GAMES.length+' games</span></div><table><thead><tr><th>ID</th><th>Icon</th><th>Tên game</th><th>Thể loại</th><th>Currency</th><th>Gói Gem</th><th>Gói Pack</th><th>Combo</th><th>Giá thấp nhất</th></tr></thead><tbody>'+
    filtered.map(function(g){
      var gemCount=(g.gem||[]).length,packCount=(g.pack||[]).length,allCount=(g.allpack||[]).length;
      var minPrice=Math.min.apply(null,(g.gem||[]).concat(g.pack||[],g.allpack||[]).map(function(t){return t.vnd}));
      return '<tr><td>'+g.id+'</td><td style="font-size:1.5rem">'+(g.icon||"🎮")+'</td><td><b>'+g.name+'</b></td><td>'+g.cat+'</td><td>'+(g.currencyName||"")+'</td><td>'+gemCount+'</td><td>'+packCount+'</td><td>'+allCount+'</td><td style="font-weight:600;color:var(--gold)">'+(minPrice||0).toLocaleString()+'đ</td></tr>';
    }).join("")+'</tbody></table></div>';
}

// Init category filter
(function initCatFilter(){
  var cats={};GAMES.forEach(function(g){var c=g.cat||"Other";cats[c]=(cats[c]||0)+1});
  var sel=document.getElementById("game-cat-filter");
  Object.entries(cats).sort(function(a,b){return b[1]-a[1]}).forEach(function(p){
    sel.innerHTML+='<option value="'+p[0]+'">'+p[0]+' ('+p[1]+')</option>';
  });
})();

function saveAndRender(){
  localStorage.setItem(STORAGE_KEY,JSON.stringify(state));
  if(currentSection==="dashboard")renderDashboard();
  if(currentSection==="orders")renderOrders();
  if(currentSection==="games")renderGames();
}

renderDashboard();
renderGames();
</script>
</body>
</html>
